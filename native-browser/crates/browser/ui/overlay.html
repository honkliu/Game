<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>overlay</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { background: transparent; }
  body { overflow: hidden; }
</style>
</head>
<body>
<!-- Floating surfaces only (§3.1). Sized by the host to the overlay rect and
     hidden (0x0) when closed. Everything here must be transparent when empty so
     the page behind shows through. -->
<div id="root" class="overlay-root is-transparent"></div>
<script src="overlay.js"></script>
</body>
</html>
