<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>native-browser</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- The shell owns three bands: header (36), rail (220/44), and the day-to-day
     transient rows (find bar). The page webview is an OS surface behind x>=rail
     and y>=header, so everything here must stay inside its rect. -->

<div id="app" class="app">

  <!-- ── window title bar ─────────────────────────────────────────────── -->
  <!-- Native decorations are on (tao default); this row is the in-window
       header band described in §3.1, not a custom title bar. -->
  <header class="header" role="banner" aria-label="Browser toolbar">
    <button id="rail-toggle" class="icon-btn" title="Toggle tab rail (Ctrl+Shift+E)"
            aria-label="Toggle tab rail" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
    </button>

    <nav class="nav-btns" aria-label="Navigation">
      <button id="btn-back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v3.5H9.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <form id="omnibox-form" class="omnibox" role="search" autocomplete="off">
      <span id="mode-chip" class="mode-chip" aria-live="polite">URL</span>
      <input id="omnibox" class="omnibox-input" type="text" spellcheck="false"
             aria-label="Address and search bar"
             aria-autocomplete="list" aria-controls="omnibox-list"
             aria-expanded="false" role="combobox"
             data-intercept-ctrl-w="word"
             placeholder="Search or type a URL" />
      <button id="bookmark-btn" class="icon-btn star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.5 1.7 3.6 3.8.5-2.8 2.7.7 3.9L8 11.3 4.6 13.2l.7-3.9L2.5 6.6l3.8-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="header-right">
      <button id="btn-downloads" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 13h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="download-badge" class="badge" hidden>0</span>
      </button>
      <button id="btn-menu" class="icon-btn" title="Menu (Ctrl+K)" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Find bar: docked row between header and page (§4.6). -->
  <div id="find-bar" class="find-bar" role="search" aria-label="Find in page" hidden>
    <svg class="find-glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10 10 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="find-input" type="text" class="find-input" data-intercept-ctrl-w="word"
           aria-label="Find text" placeholder="Find in page" spellcheck="false" />
    <span id="find-count" class="find-count" aria-live="polite">0/0</span>
    <button id="find-case" class="toggle-btn" title="Match case (Alt+C)" aria-pressed="false">Aa</button>
    <button id="find-word" class="toggle-btn" title="Whole word — regex is not available on this runtime" aria-pressed="false" aria-disabled="true">Ab|</button>
    <button id="find-all" class="toggle-btn" title="Highlight all (Alt+A)" aria-pressed="false">All</button>
    <button id="find-prev" class="icon-btn" title="Previous match (Shift+F3)" aria-label="Previous match">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" class="icon-btn" title="Next match (F3)" aria-label="Next match">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-close" class="icon-btn" title="Close find (Esc)" aria-label="Close find">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="main">
    <!-- ── tab rail ───────────────────────────────────────────────────── -->
    <aside id="rail" class="rail" aria-label="Tabs">
      <div class="rail-pinned" id="rail-pinned" hidden></div>
      <div class="rail-groups" id="rail-groups"></div>
      <ul id="rail-list" class="rail-list" role="listbox" aria-label="Open tabs" aria-orientation="vertical"></ul>
      <button id="new-tab" class="rail-new" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="rail-new-label">New tab</span>
      </button>
      <div class="rail-pinned-grid" id="rail-pinned-grid" hidden></div>
    </aside>

    <!-- ── docked panels ──────────────────────────────────────────────── -->
    <section id="downloads-panel" class="panel" aria-label="Downloads" hidden>
      <div class="panel-head">
        <h2 class="panel-title">Downloads</h2>
        <div class="panel-actions">
          <button id="downloads-clear" class="text-btn">Clear all</button>
          <button id="downloads-close" class="icon-btn" aria-label="Close downloads">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <ul id="downloads-list" class="downloads-list" aria-label="Download items"></ul>
      <p id="downloads-empty" class="empty-hint">No downloads. <kbd>Ctrl+J</kbd> opens this panel.</p>
    </section>
  </div>

  <!-- ── overlays that live in the *shell* (never over page content) ───── -->
  <!-- The omnibox dropdown is drawn by the overlay webview; this is the
       accessible mirror used by screen readers and by the W9 keyboard walk. -->
  <div id="omnibox-dropdown" class="dropdown" role="listbox" aria-label="Suggestions" hidden></div>

  <!-- Command palette lives in the overlay webview (overlay.html). -->

  <!-- History panel also lives in the overlay webview. -->

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Row context menu (§3.5 Space / Shift+F10): max 8 items, one level. -->
  <div id="item-menu" class="menu" role="menu" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
