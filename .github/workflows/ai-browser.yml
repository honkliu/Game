name: AI Browser

on:
  push:
    paths: ['ai-browser/**', 'run-ai-browser.*', '.github/workflows/ai-browser.yml']
  pull_request:
    paths: ['ai-browser/**', 'run-ai-browser.*', '.github/workflows/ai-browser.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-browser
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            ai-browser/ui/package-lock.json
            ai-browser/e2e/package-lock.json
      - name: Select stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install UI dependencies
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Check UI types
        run: npm --prefix ui run typecheck
      - name: Test UI
        run: npm --prefix ui test
      - name: Test Rust and native WKWebView integration
        run: cargo test --locked --workspace
      - name: Install Windows regression dependencies
        if: runner.os == 'Windows'
        run: npm --prefix e2e ci --ignore-scripts --no-audit --no-fund
      - name: Run Windows browser regressions
        if: runner.os == 'Windows'
        env:
          BROWSER_EXE: '${{ github.workspace }}\ai-browser\target\debug\river_browser.exe'
        run: cargo build --locked -p browser && npm --prefix e2e test
      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Package application
        run: cargo packager --release
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          $images = @(Get-ChildItem dist -Filter '*.dmg')
          if ($images.Count -ne 1) { throw 'Expected one native-architecture DMG.' }
          hdiutil verify $images[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'DMG verification failed.' }
      - name: Upload application package
        uses: actions/upload-artifact@v6
        with:
          name: ai-browser-${{ runner.os }}-${{ runner.arch }}
          path: |
            ai-browser/dist/*-setup.exe
            ai-browser/dist/*.dmg
          if-no-files-found: error
