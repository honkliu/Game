[workspace]
resolver = "2"
members = ["crates/contract", "crates/utility", "crates/shell"]
default-members = ["crates/shell"]
# Standalone on purpose: a measurement spike with its own dependency set.
exclude = ["tools/wv2-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "debuginfo"
