[package]
name = "browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AI-native browser: WebView2 on Windows and WKWebView on macOS"

[package.metadata.packager]
product-name = "River"
identifier = "com.honkliu.ai-browser"
publisher = "honkliu"
category = "Productivity"
icons = ["assets/browser@2x.png", "assets/browser.ico"]
out-dir = "../../dist"
before-packaging-command = "cargo build --locked --release --package browser"

[package.metadata.packager.macos]
minimum-system-version = "14.0"
info-plist-path = "../../tools/macos/Info.plist"

[package.metadata.packager.nsis]
installMode = "perMachine"
installer-icon = "assets/browser.ico"
preinstall-section = '''
Section "WebView2 Runtime"
  SetRegView 32
  ReadRegStr $0 HKLM "SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" "pv"
  SetRegView 64
  ReadRegStr $1 HKLM "SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" "pv"
  ${If} $0 == "0.0.0.0"
    StrCpy $0 ""
  ${EndIf}
  ${If} $1 == "0.0.0.0"
    StrCpy $1 ""
  ${EndIf}
  ${If} $0 == ""
  ${AndIf} $1 == ""
    InitPluginsDir
    DetailPrint "Downloading Microsoft Edge WebView2 Runtime..."
    nsis_tauri_utils::download "https://go.microsoft.com/fwlink/p/?LinkId=2124703" "$PLUGINSDIR\MicrosoftEdgeWebview2Setup.exe"
    Pop $0
    ${If} $0 != 0
      Abort "Could not download WebView2 Runtime. Check your internet connection and run Setup again."
    ${EndIf}
    ExecWait '"$PLUGINSDIR\MicrosoftEdgeWebview2Setup.exe" /silent /install' $1
    ${If} $1 == 3010
      SetRebootFlag true
    ${ElseIf} $1 != 0
      Abort "WebView2 Runtime installation failed. Restart Windows and run Setup again."
    ${EndIf}
  ${EndIf}
SectionEnd
'''

[[bin]]
name = "river_browser"
path = "src/main.rs"

[[test]]
name = "webkit"
path = "tests/webkit.rs"
harness = false

[dependencies]
# windowing + webview (WebView2 on Windows, WKWebView on macOS)
wry = { version = "=0.57.2", features = ["devtools"] }
tao = "=0.37.2"
# typed IPC envelope + JSON state files
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The AI platform contract: document identity, action levels, the typed failure
# taxonomy, and the shell<->utility frame codec. One set of Rust types on both
# sides of the shell/utility boundary is the point of that design, so the shell
# consumes these types directly rather than mirroring them. Path dependency,
# serde + serde_json only, builds offline.
ai-platform-contract = { path = "../contract" }
# The AI utility runs inside this same executable (`river_browser.exe --ai-utility`), in its own process.
ai-utility = { path = "../utility" }
# history/bookmarks store; bundled = no system SQLite dependency
rusqlite = { version = "0.32.1", features = ["bundled"] }
# url-template encoding (%s substitution) for the search engine
percent-encoding = "2"
url = "2"
httparse = "1"
getrandom = "0.3"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
# The PDF viewer fetches documents for pages (same TLS stack as the AI utility).
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKContentWorld", "WKFrameInfo", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
# Shared WebView2 environment. wry's `WebContext` is a zero-sized token on
# Windows (see wry-0.57.2/src/web_context.rs), so every webview would otherwise
# create its own browser process. Creating one environment ourselves and passing
# it to every builder via `with_environment` is what keeps the process count
# near Chrome's. Version must match the one wry links (0.39.x).
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
# raw Win32: monotonic timing, HWND work, process enumeration for W10,
# and reveal-in-Explorer for the downloads panel.
# Pinned to the version wry links so COM/FFI types line up exactly.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # `sys::command_line` reads a target process's PEB to get its command line,
    # which is the only way to tell a WebView2 browser process from a renderer
    # (`--type=`) without a WMI dependency: Toolhelp32 carries no command line.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    # `ai::link` puts the AI utility in a kill-on-close job so it cannot outlive us.
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
tempfile = "3"