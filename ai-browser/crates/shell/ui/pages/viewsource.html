<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>View source unavailable</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { background: var(--bg-page); }
  .wrap { max-width: 560px; margin: 16vh auto; padding: 0 var(--space-5); display: grid; gap: var(--space-3); }
  h1 { font: var(--text-xl); margin: 0; }
  p { font: var(--text-base); color: var(--fg-muted); margin: 0; }
</style>
</head>
<body>
<!-- §3.5 Ctrl+U: WebView2 does not implement view-source:, so the binding is
     surfaced as this page instead of being silently dead. -->
<main class="wrap" role="alert">
  <h1>View source is not available</h1>
  <p>This browser renders with WebView2, which does not implement <code>view-source:</code> for pages loaded this way.</p>
  <p>The address bar will not offer to open a source view it cannot show.</p>
</main>
</body>
</html>
