<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New tab</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { background: var(--bg-page); overflow: auto; }
  .newtab {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12vh var(--space-5) var(--space-8);
    gap: var(--space-7);
  }
  .clock {
    font: var(--text-display);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--fg-primary);
    text-align: center;
  }
  .clock .date { display: block; font: var(--text-base); color: var(--fg-muted); letter-spacing: 0; margin-top: var(--space-1); }
  .section { width: min(720px, 100%); }
  .section-title { font: var(--text-sm-strong); color: var(--fg-muted); margin-bottom: var(--space-3); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
  .tile {
    height: 96px; min-width: 120px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-2); padding: var(--space-3);
    text-align: center; overflow: hidden;
  }
  .tile:hover { background: var(--bg-surface-hover); }
  .tile .dot { width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--accent-15); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 13px/1 var(--font-ui); }
  .tile .name { font: var(--text-sm); color: var(--fg-primary); width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { height: 40px; display: flex; align-items: center; gap: var(--space-3); border-radius: var(--radius-sm); padding: 0 var(--space-2); }
  .recent li:hover { background: var(--bg-surface-hover); }
  .recent .rt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--text-base); }
  .recent .rh { flex: none; font: var(--text-sm); color: var(--fg-muted); }
  .show-all { font: var(--text-sm); color: var(--accent); }
  .empty { font: var(--text-sm); color: var(--fg-subtle); }
</style>
</head>
<body>
<main class="newtab">
  <div class="clock" id="clock">--:--<span class="date" id="date"></span></div>

  <section class="section">
    <div class="section-title">Pinned</div>
    <div class="tiles" id="tiles"></div>
    <div id="tiles-empty" class="empty">Bookmark a page with <kbd>Ctrl+D</kbd> to pin it here.</div>
  </section>

  <section class="section">
    <div class="section-title">Recent</div>
    <ul class="recent" id="recent"></ul>
    <a class="show-all" href="#" id="show-all">Show all history</a>
  </section>
</main>
<script src="newtab.js"></script>
</body>
</html>
